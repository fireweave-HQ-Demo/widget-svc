# Generated by fireweave test-bench
# workspace=dd_e2e bucket=local env=dev
# destination=datadog (local hot-reload)
# services: <app>-api, <app>-web, collector (observability)
name: bench-dd_e2e-local-dev
services:
  atlas-api:
    # api — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "3000"
      BENCH_DESTINATION: datadog
      OTEL_SERVICE_NAME: atlas-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=dd_e2e,deployment.environment=dev
    ports:
      - "0.0.0.0:18084:3000"
    volumes:
      - bench-dd_e2e-atlas-api:/app
    networks: [bench]
    depends_on: [collector]
    command: ["bun","--hot","run","src/main.ts"]
    restart: unless-stopped
  atlas-web:
    # web — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "5173"
      BENCH_DESTINATION: datadog
      OTEL_SERVICE_NAME: atlas-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=dd_e2e,deployment.environment=dev
      VITE_SERVICE_NAME: atlas-web
      VITE_APP_ENV: dev
      VITE_DESTINATION: datadog
      VITE_API_PORT: "18084"
      VITE_OTEL_PORT: "18087"
    ports:
      - "0.0.0.0:18086:5173"
    volumes:
      - bench-dd_e2e-atlas-web:/app
    networks: [bench]
    depends_on: [collector]
    command: ["bun","run","dev","--","--host","0.0.0.0","--port","5173"]
    restart: unless-stopped
  collector:
    # observability — OTLP → datadog
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "0.0.0.0:18087:4318"
      - "0.0.0.0:18088:13133"
    env_file:
      - path: /workspaces/fireweaveai-platform/.worktrees/test-bench/bench/credentials/datadog
        required: false
    volumes:
      - bench-dd_e2e-collector:/etc/otelcol-contrib
    networks: [bench]
    restart: unless-stopped
networks:
  bench:
    name: bench-dd_e2e-local-dev-net
volumes:
  bench-dd_e2e-atlas-api:
    external: true
  bench-dd_e2e-atlas-web:
    external: true
  bench-dd_e2e-collector:
    external: true

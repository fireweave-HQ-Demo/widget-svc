# Generated by fireweave test-bench
# workspace=demo bucket=local env=dev
# destination=datadog (local hot-reload)
# services: <app>-api, <app>-web, collector (observability)
name: bench-demo-local-dev
services:
  atlas-api:
    # api — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "3000"
      BENCH_DESTINATION: datadog
      OTEL_SERVICE_NAME: atlas-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=demo,deployment.environment=dev
      IDENTITY_ENABLED: "true"
      IDENTITY_SEED_PATH: /data/identity/seed.json
    ports:
      - "0.0.0.0:18102:3000"
    volumes:
      - bench-demo-atlas-api:/app
      - bench-demo-identity:/data/identity:ro
    networks: [bench]
    depends_on: [collector]
    command: ["bun","--hot","run","src/main.ts"]
    restart: unless-stopped
  atlas-web:
    # web — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "5173"
      BENCH_DESTINATION: datadog
      OTEL_SERVICE_NAME: atlas-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=demo,deployment.environment=dev
      VITE_SERVICE_NAME: atlas-web
      VITE_APP_ENV: dev
      VITE_DESTINATION: datadog
      VITE_API_PORT: "18102"
      VITE_OTEL_PORT: "18104"
      VITE_IDENTITY_ENABLED: "true"
    ports:
      - "0.0.0.0:18103:5173"
    volumes:
      - bench-demo-atlas-web:/app
      - bench-demo-identity:/data/identity:ro
    networks: [bench]
    depends_on: [collector]
    command: ["bun","run","dev","--","--host","0.0.0.0","--port","5173"]
    restart: unless-stopped
  collector:
    # observability — OTLP → datadog
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "0.0.0.0:18104:4318"
      - "0.0.0.0:18105:13133"
    env_file:
      - path: /Users/kalyanchowdary/Desktop/code/work/test-bench/bench/credentials/datadog
        required: false
    volumes:
      - bench-demo-collector:/etc/otelcol-contrib
    networks: [bench]
    restart: unless-stopped
networks:
  bench:
    name: bench-demo-local-dev-net
volumes:
  bench-demo-atlas-api:
    external: true
  bench-demo-atlas-web:
    external: true
  bench-demo-collector:
    external: true
  bench-demo-identity:
    external: true

# Generated by fireweave test-bench
# workspace=rt0 bucket=local env=dev
# destination=oodle (local hot-reload)
# services: <app>-api, <app>-web, collector (observability)
name: bench-rt0-local-dev
services:
  atlas-api:
    # api — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "3000"
      BENCH_DESTINATION: oodle
      OTEL_SERVICE_NAME: atlas-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=rt0,deployment.environment=dev
    ports:
      - "0.0.0.0:18000:3000"
    volumes:
      - bench-rt0-atlas-api:/app
    networks: [bench]
    depends_on: [collector]
    command: ["bun","--hot","run","src/main.ts"]
    restart: unless-stopped
  atlas-web:
    # web — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "5173"
      BENCH_DESTINATION: oodle
      OTEL_SERVICE_NAME: atlas-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=rt0,deployment.environment=dev
      VITE_SERVICE_NAME: atlas-web
      VITE_APP_ENV: dev
      VITE_DESTINATION: oodle
      VITE_API_PORT: "18000"
      VITE_OTEL_PORT: "18002"
    ports:
      - "0.0.0.0:18001:5173"
    volumes:
      - bench-rt0-atlas-web:/app
    networks: [bench]
    depends_on: [collector]
    command: ["bun","run","dev","--","--host","0.0.0.0","--port","5173"]
    restart: unless-stopped
  collector:
    # observability — OTLP → oodle
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "0.0.0.0:18002:4318"
      - "0.0.0.0:18003:13133"
    env_file:
      - path: /workspaces/test-bench/bench/credentials/oodle
        required: false
    volumes:
      - bench-rt0-collector:/etc/otelcol-contrib
    networks: [bench]
    restart: unless-stopped
networks:
  bench:
    name: bench-rt0-local-dev-net
volumes:
  bench-rt0-atlas-api:
    external: true
  bench-rt0-atlas-web:
    external: true
  bench-rt0-collector:
    external: true

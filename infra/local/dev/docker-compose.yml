# Generated by fireweave test-bench
# workspace=stg_polyglot bucket=local env=dev
# destination=oodle (local hot-reload)
# services: <app>-api, <app>-web, collector (observability)
name: bench-stg_polyglot-local-dev
services:
  atlas-api:
    # api — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "3000"
      BENCH_DESTINATION: oodle
      OTEL_SERVICE_NAME: atlas-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=stg_polyglot,deployment.environment=dev
    ports:
      - "0.0.0.0:18060:3000"
    volumes:
      - bench-stg_polyglot-atlas-api:/app
    networks: [bench]
    depends_on: [collector]
    command: ["bun","--hot","run","src/main.ts"]
    restart: unless-stopped
  atlas-web:
    # web — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "5173"
      BENCH_DESTINATION: oodle
      OTEL_SERVICE_NAME: atlas-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=stg_polyglot,deployment.environment=dev
      VITE_SERVICE_NAME: atlas-web
      VITE_APP_ENV: dev
      VITE_DESTINATION: oodle
      VITE_API_PORT: "18060"
      VITE_OTEL_PORT: "18066"
    ports:
      - "0.0.0.0:18061:5173"
    volumes:
      - bench-stg_polyglot-atlas-web:/app
    networks: [bench]
    depends_on: [collector]
    command: ["bun","run","dev","--","--host","0.0.0.0","--port","5173"]
    restart: unless-stopped
  lantern-api:
    # api — lantern (python+svelte)
    image: python:3.12-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "3000"
      BENCH_DESTINATION: oodle
      OTEL_SERVICE_NAME: lantern-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=stg_polyglot,deployment.environment=dev
      PYTHONPATH: /app
    ports:
      - "0.0.0.0:18062:3000"
    volumes:
      - bench-stg_polyglot-lantern-api:/app
    networks: [bench]
    depends_on: [collector]
    command: ["sh","-c","command -v watchmedo >/dev/null 2>&1 || pip install -q watchdog; watchmedo auto-restart -d src -p '*.py' -R -- python -m src.main"]
    restart: unless-stopped
  lantern-web:
    # web — lantern (python+svelte)
    image: node:22-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "5173"
      BENCH_DESTINATION: oodle
      OTEL_SERVICE_NAME: lantern-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=stg_polyglot,deployment.environment=dev
      VITE_SERVICE_NAME: lantern-web
      VITE_APP_ENV: dev
      VITE_DESTINATION: oodle
      VITE_API_PORT: "18062"
      VITE_OTEL_PORT: "18066"
    ports:
      - "0.0.0.0:18063:5173"
    volumes:
      - bench-stg_polyglot-lantern-web:/app
    networks: [bench]
    depends_on: [collector]
    command: ["npm","run","dev","--","--host","0.0.0.0","--port","5173"]
    restart: unless-stopped
  quay-api:
    # api — quay (go+solid)
    image: golang:1.22-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "3000"
      BENCH_DESTINATION: oodle
      OTEL_SERVICE_NAME: quay-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=stg_polyglot,deployment.environment=dev
    ports:
      - "0.0.0.0:18064:3000"
    volumes:
      - bench-stg_polyglot-quay-api:/app
    networks: [bench]
    depends_on: [collector]
    command: ["go","run","./src"]
    restart: unless-stopped
  quay-web:
    # web — quay (go+solid)
    image: node:22-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "5173"
      BENCH_DESTINATION: oodle
      OTEL_SERVICE_NAME: quay-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=stg_polyglot,deployment.environment=dev
      VITE_SERVICE_NAME: quay-web
      VITE_APP_ENV: dev
      VITE_DESTINATION: oodle
      VITE_API_PORT: "18064"
      VITE_OTEL_PORT: "18066"
    ports:
      - "0.0.0.0:18065:5173"
    volumes:
      - bench-stg_polyglot-quay-web:/app
    networks: [bench]
    depends_on: [collector]
    command: ["npm","run","dev","--","--host","0.0.0.0","--port","5173"]
    restart: unless-stopped
  collector:
    # observability — OTLP → oodle
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "0.0.0.0:18066:4318"
      - "0.0.0.0:18067:13133"
    env_file:
      - path: /Users/kalyanchowdary/Desktop/code/work/test-bench/bench/credentials/oodle
        required: false
    volumes:
      - bench-stg_polyglot-collector:/etc/otelcol-contrib
    networks: [bench]
    restart: unless-stopped
networks:
  bench:
    name: bench-stg_polyglot-local-dev-net
volumes:
  bench-stg_polyglot-atlas-api:
    external: true
  bench-stg_polyglot-atlas-web:
    external: true
  bench-stg_polyglot-lantern-api:
    external: true
  bench-stg_polyglot-lantern-web:
    external: true
  bench-stg_polyglot-quay-api:
    external: true
  bench-stg_polyglot-quay-web:
    external: true
  bench-stg_polyglot-collector:
    external: true

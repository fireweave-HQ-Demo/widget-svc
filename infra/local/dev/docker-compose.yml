# Generated by fireweave test-bench
# workspace=sample-atlas bucket=local env=dev
# destination=control (local hot-reload)
# services: <app>-api, <app>-web, collector (observability)
name: bench-sample-atlas-local-dev
services:
  atlas-api:
    # api — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "3000"
      BENCH_DESTINATION: control
      OTEL_SERVICE_NAME: atlas-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=sample-atlas,deployment.environment=dev
    ports:
      - "127.0.0.1:18004:3000"
    volumes:
      - bench-sample-atlas-atlas-api:/app
    networks: [bench]
    depends_on: [collector]
    command: ["bun","--hot","run","src/main.ts"]
    restart: unless-stopped
  atlas-web:
    # web — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "5173"
      BENCH_DESTINATION: control
      OTEL_SERVICE_NAME: atlas-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=sample-atlas,deployment.environment=dev
      VITE_SERVICE_NAME: atlas-web
      VITE_APP_ENV: dev
      VITE_DESTINATION: control
      VITE_API_BASE: http://127.0.0.1:18004
      VITE_OTEL_ENDPOINT: http://127.0.0.1:18006
    ports:
      - "127.0.0.1:18005:5173"
    volumes:
      - bench-sample-atlas-atlas-web:/app
    networks: [bench]
    depends_on: [collector]
    command: ["bun","run","dev","--","--host","0.0.0.0","--port","5173"]
    restart: unless-stopped
  collector:
    # observability — OTLP → control
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:18006:4318"
      - "127.0.0.1:18007:13133"
    volumes:
      - bench-sample-atlas-collector:/etc/otelcol-contrib
    networks: [bench]
    restart: unless-stopped
networks:
  bench:
    name: bench-sample-atlas-local-dev-net
volumes:
  bench-sample-atlas-atlas-api:
    external: true
  bench-sample-atlas-atlas-web:
    external: true
  bench-sample-atlas-collector:
    external: true

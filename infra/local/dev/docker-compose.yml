# Generated by fireweave test-bench
# workspace=dd_cove bucket=local env=dev
# destination=datadog (local hot-reload)
# services: <app>-api, <app>-web, collector (observability)
name: bench-dd_cove-local-dev
services:
  cove-gateway:
    # microservice — cove (polyglot-microservices)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "3000"
      BENCH_DESTINATION: datadog
      OTEL_SERVICE_NAME: cove-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=dd_cove,deployment.environment=dev
    ports:
      - "0.0.0.0:18034:3000"
    volumes:
      - bench-dd_cove-cove-gateway:/app
    networks: [bench]
    depends_on: [collector]
    command: ["bun","--hot","run","src/main.ts"]
    restart: unless-stopped
  cove-orders:
    # microservice — cove (polyglot-microservices)
    image: python:3.12-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "3000"
      BENCH_DESTINATION: datadog
      OTEL_SERVICE_NAME: cove-orders
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=dd_cove,deployment.environment=dev
      PYTHONPATH: /app
    ports:
      - "0.0.0.0:18035:3000"
    volumes:
      - bench-dd_cove-cove-orders:/app
    networks: [bench]
    depends_on: [collector]
    command: ["sh","-c","pip install -q watchdog >/dev/null 2>&1; watchmedo auto-restart -d src -p '*.py' -R -- python -m src.main"]
    restart: unless-stopped
  cove-workers:
    # microservice — cove (polyglot-microservices)
    image: swift:5.10
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "3000"
      BENCH_DESTINATION: datadog
      OTEL_SERVICE_NAME: cove-workers
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=dd_cove,deployment.environment=dev
    ports:
      - "0.0.0.0:18036:3000"
    volumes:
      - bench-dd_cove-cove-workers:/app
    networks: [bench]
    depends_on: [collector]
    command: ["./.build/release/cove_workers"]
    restart: unless-stopped
  collector:
    # observability — OTLP → datadog
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "0.0.0.0:18037:4318"
      - "0.0.0.0:18038:13133"
    env_file:
      - path: /Users/kalyanchowdary/Desktop/code/work/test-bench/bench/credentials/datadog
        required: false
    volumes:
      - bench-dd_cove-collector:/etc/otelcol-contrib
    networks: [bench]
    restart: unless-stopped
networks:
  bench:
    name: bench-dd_cove-local-dev-net
volumes:
  bench-dd_cove-cove-gateway:
    external: true
  bench-dd_cove-cove-orders:
    external: true
  bench-dd_cove-cove-workers:
    external: true
  bench-dd_cove-collector:
    external: true

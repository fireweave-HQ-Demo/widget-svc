# Generated by fireweave test-bench
# workspace=demo1 bucket=local env=dev
# destination=openobserve (local hot-reload)
# services: <app>-api, <app>-web, collector (observability)
name: bench-demo1-local-dev
services:
  atlas-api:
    # api — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "3000"
      BENCH_DESTINATION: openobserve
      OTEL_SERVICE_NAME: atlas-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=demo1,deployment.environment=dev
      IDENTITY_ENABLED: "true"
      IDENTITY_SEED_PATH: /data/identity/seed.json
    ports:
      - "127.0.0.1:18008:3000"
    volumes:
      - bench-demo1-atlas-api:/app
      - bench-demo1-identity:/data/identity:ro
    networks: [bench]
    depends_on: [collector]
    command: ["bun","--hot","run","src/main.ts"]
    restart: unless-stopped
  atlas-web:
    # web — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "5173"
      BENCH_DESTINATION: openobserve
      OTEL_SERVICE_NAME: atlas-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=demo1,deployment.environment=dev
      VITE_SERVICE_NAME: atlas-web
      VITE_APP_ENV: dev
      VITE_DESTINATION: openobserve
      VITE_API_BASE: http://127.0.0.1:18008
      VITE_OTEL_ENDPOINT: http://127.0.0.1:18010
      VITE_IDENTITY_ENABLED: "true"
    ports:
      - "127.0.0.1:18009:5173"
    volumes:
      - bench-demo1-atlas-web:/app
      - bench-demo1-identity:/data/identity:ro
    networks: [bench]
    depends_on: [collector]
    command: ["bun","run","dev","--","--host","0.0.0.0","--port","5173"]
    restart: unless-stopped
  collector:
    # observability — OTLP → openobserve
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:18010:4318"
      - "127.0.0.1:18011:13133"
    env_file:
      - path: /workspaces/fireweaveai-platform/.worktrees/test-bench/bench/credentials/openobserve
        required: false
    volumes:
      - bench-demo1-collector:/etc/otelcol-contrib
    networks: [bench]
    restart: unless-stopped
networks:
  bench:
    name: bench-demo1-local-dev-net
volumes:
  bench-demo1-atlas-api:
    external: true
  bench-demo1-atlas-web:
    external: true
  bench-demo1-collector:
    external: true
  bench-demo1-identity:
    external: true

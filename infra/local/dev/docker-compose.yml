# Generated by fireweave test-bench
# workspace=sample-delta bucket=local env=dev
# destination=control (local hot-reload)
# services: <app>-api, <app>-web, collector (observability)
name: bench-sample-delta-local-dev
services:
  delta-gateway:
    # microservice — delta (ts-microservices)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "3000"
      BENCH_DESTINATION: control
      OTEL_SERVICE_NAME: delta-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=sample-delta,deployment.environment=dev
    ports:
      - "127.0.0.1:18012:3000"
    volumes:
      - bench-sample-delta-delta-gateway:/app
    networks: [bench]
    depends_on: [collector]
    command: ["bun","--hot","run","src/main.ts"]
    restart: unless-stopped
  delta-orders:
    # microservice — delta (ts-microservices)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "3000"
      BENCH_DESTINATION: control
      OTEL_SERVICE_NAME: delta-orders
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=sample-delta,deployment.environment=dev
    ports:
      - "127.0.0.1:18013:3000"
    volumes:
      - bench-sample-delta-delta-orders:/app
    networks: [bench]
    depends_on: [collector]
    command: ["bun","--hot","run","src/main.ts"]
    restart: unless-stopped
  delta-workers:
    # microservice — delta (ts-microservices)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "3000"
      BENCH_DESTINATION: control
      OTEL_SERVICE_NAME: delta-workers
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=sample-delta,deployment.environment=dev
    ports:
      - "127.0.0.1:18014:3000"
    volumes:
      - bench-sample-delta-delta-workers:/app
    networks: [bench]
    depends_on: [collector]
    command: ["bun","--hot","run","src/main.ts"]
    restart: unless-stopped
  collector:
    # observability — OTLP → control
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:18015:4318"
      - "127.0.0.1:18016:13133"
    volumes:
      - bench-sample-delta-collector:/etc/otelcol-contrib
    networks: [bench]
    restart: unless-stopped
networks:
  bench:
    name: bench-sample-delta-local-dev-net
volumes:
  bench-sample-delta-delta-gateway:
    external: true
  bench-sample-delta-delta-orders:
    external: true
  bench-sample-delta-delta-workers:
    external: true
  bench-sample-delta-collector:
    external: true

# Generated by fireweave test-bench
# workspace=sample_skills_git bucket=local env=dev
# destination=control (local hot-reload)
# services: <app>-api, <app>-web, collector (observability)
name: bench-sample_skills_git-local-dev
services:
  atlas-api:
    # api — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "3000"
      BENCH_DESTINATION: control
      OTEL_SERVICE_NAME: atlas-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=sample_skills_git,deployment.environment=dev
      IDENTITY_ENABLED: "true"
      IDENTITY_SEED_PATH: /data/identity/seed.json
    ports:
      - "127.0.0.1:18032:3000"
    volumes:
      - bench-sample_skills_git-atlas-api:/app
      - bench-sample_skills_git-identity:/data/identity:ro
    networks: [bench]
    depends_on: [collector]
    command: ["bun","--hot","run","src/main.ts"]
    restart: unless-stopped
  atlas-web:
    # web — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "5173"
      BENCH_DESTINATION: control
      OTEL_SERVICE_NAME: atlas-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=sample_skills_git,deployment.environment=dev
      VITE_SERVICE_NAME: atlas-web
      VITE_APP_ENV: dev
      VITE_DESTINATION: control
      VITE_API_BASE: http://127.0.0.1:18032
      VITE_OTEL_ENDPOINT: http://127.0.0.1:18034
      VITE_IDENTITY_ENABLED: "true"
    ports:
      - "127.0.0.1:18033:5173"
    volumes:
      - bench-sample_skills_git-atlas-web:/app
      - bench-sample_skills_git-identity:/data/identity:ro
    networks: [bench]
    depends_on: [collector]
    command: ["bun","run","dev","--","--host","0.0.0.0","--port","5173"]
    restart: unless-stopped
  collector:
    # observability — OTLP → control
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:18034:4318"
      - "127.0.0.1:18035:13133"
    volumes:
      - bench-sample_skills_git-collector:/etc/otelcol-contrib
    networks: [bench]
    restart: unless-stopped
networks:
  bench:
    name: bench-sample_skills_git-local-dev-net
volumes:
  bench-sample_skills_git-atlas-api:
    external: true
  bench-sample_skills_git-atlas-web:
    external: true
  bench-sample_skills_git-collector:
    external: true
  bench-sample_skills_git-identity:
    external: true

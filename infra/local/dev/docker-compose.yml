# Generated by fireweave test-bench
# workspace=sample-harbor bucket=local env=dev
# destination=control (local hot-reload)
# services: <app>-api, <app>-web, collector (observability)
name: bench-sample-harbor-local-dev
services:
  harbor-api:
    # api — harbor (node+vue)
    image: node:22-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "3000"
      BENCH_DESTINATION: control
      OTEL_SERVICE_NAME: harbor-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=sample-harbor,deployment.environment=dev
    ports:
      - "127.0.0.1:18008:3000"
    volumes:
      - bench-sample-harbor-harbor-api:/app
    networks: [bench]
    depends_on: [collector]
    command: ["npx","tsx","watch","src/main.ts"]
    restart: unless-stopped
  harbor-web:
    # web — harbor (node+vue)
    image: node:22-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "5173"
      BENCH_DESTINATION: control
      OTEL_SERVICE_NAME: harbor-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=sample-harbor,deployment.environment=dev
      VITE_SERVICE_NAME: harbor-web
      VITE_APP_ENV: dev
      VITE_DESTINATION: control
      VITE_API_BASE: http://127.0.0.1:18008
      VITE_OTEL_ENDPOINT: http://127.0.0.1:18010
    ports:
      - "127.0.0.1:18009:5173"
    volumes:
      - bench-sample-harbor-harbor-web:/app
    networks: [bench]
    depends_on: [collector]
    command: ["npm","run","dev","--","--host","0.0.0.0","--port","5173"]
    restart: unless-stopped
  collector:
    # observability — OTLP → control
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:18010:4318"
      - "127.0.0.1:18011:13133"
    volumes:
      - bench-sample-harbor-collector:/etc/otelcol-contrib
    networks: [bench]
    restart: unless-stopped
networks:
  bench:
    name: bench-sample-harbor-local-dev-net
volumes:
  bench-sample-harbor-harbor-api:
    external: true
  bench-sample-harbor-harbor-web:
    external: true
  bench-sample-harbor-collector:
    external: true

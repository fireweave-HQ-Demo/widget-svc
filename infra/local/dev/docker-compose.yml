# Generated by fireweave test-bench
# workspace=dd_react_python bucket=local env=dev
# destination=datadog (local hot-reload)
# services: <app>-api, <app>-web, collector (observability)
name: bench-dd_react_python-local-dev
services:
  atlas-api:
    # api — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "3000"
      BENCH_DESTINATION: datadog
      OTEL_SERVICE_NAME: atlas-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=dd_react_python,deployment.environment=dev
    ports:
      - "0.0.0.0:18008:3000"
    volumes:
      - bench-dd_react_python-atlas-api:/app
    networks: [bench]
    depends_on: [collector]
    command: ["bun","--hot","run","src/main.ts"]
    restart: unless-stopped
  atlas-web:
    # web — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "5173"
      BENCH_DESTINATION: datadog
      OTEL_SERVICE_NAME: atlas-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=dd_react_python,deployment.environment=dev
      VITE_SERVICE_NAME: atlas-web
      VITE_APP_ENV: dev
      VITE_DESTINATION: datadog
      VITE_API_PORT: "18008"
      VITE_OTEL_PORT: "18012"
    ports:
      - "0.0.0.0:18009:5173"
    volumes:
      - bench-dd_react_python-atlas-web:/app
    networks: [bench]
    depends_on: [collector]
    command: ["bun","run","dev","--","--host","0.0.0.0","--port","5173"]
    restart: unless-stopped
  lantern-api:
    # api — lantern (python+svelte)
    image: python:3.12-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "3000"
      BENCH_DESTINATION: datadog
      OTEL_SERVICE_NAME: lantern-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=dd_react_python,deployment.environment=dev
      PYTHONPATH: /app
    ports:
      - "0.0.0.0:18010:3000"
    volumes:
      - bench-dd_react_python-lantern-api:/app
    networks: [bench]
    depends_on: [collector]
    command: ["sh","-c","pip install -q -r requirements.txt >/dev/null 2>&1; command -v watchmedo >/dev/null 2>&1 || pip install -q watchdog; watchmedo auto-restart -d src -p '*.py' -R -- python -m src.main"]
    restart: unless-stopped
  lantern-web:
    # web — lantern (python+svelte)
    image: node:22-alpine
    working_dir: /app
    environment:
      APP_ENV: dev
      PORT: "5173"
      BENCH_DESTINATION: datadog
      OTEL_SERVICE_NAME: lantern-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=dd_react_python,deployment.environment=dev
      VITE_SERVICE_NAME: lantern-web
      VITE_APP_ENV: dev
      VITE_DESTINATION: datadog
      VITE_API_PORT: "18010"
      VITE_OTEL_PORT: "18012"
    ports:
      - "0.0.0.0:18011:5173"
    volumes:
      - bench-dd_react_python-lantern-web:/app
    networks: [bench]
    depends_on: [collector]
    command: ["npm","run","dev","--","--host","0.0.0.0","--port","5173"]
    restart: unless-stopped
  collector:
    # observability — OTLP → datadog
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "0.0.0.0:18012:4318"
      - "0.0.0.0:18013:13133"
    env_file:
      - path: /Users/kalyanchowdary/Desktop/code/work/test-bench/bench/credentials/datadog
        required: false
    volumes:
      - bench-dd_react_python-collector:/etc/otelcol-contrib
    networks: [bench]
    restart: unless-stopped
networks:
  bench:
    name: bench-dd_react_python-local-dev-net
volumes:
  bench-dd_react_python-atlas-api:
    external: true
  bench-dd_react_python-atlas-web:
    external: true
  bench-dd_react_python-lantern-api:
    external: true
  bench-dd_react_python-lantern-web:
    external: true
  bench-dd_react_python-collector:
    external: true

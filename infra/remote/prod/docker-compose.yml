      - "0.0.0.0:18070:3000"
    volumes:
      - bench-stg_polyglot-lantern-api:/app
    networks: [bench]
    depends_on: [collector]
    command: ["python","-m","src.main"]
    restart: unless-stopped
  lantern-web:
    # web — lantern (python+svelte)

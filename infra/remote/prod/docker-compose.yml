# Generated by fireweave test-bench
# workspace=stg_polyglot bucket=remote env=prod
# destination=oodle
# services: <app>-api, <app>-web, collector (observability)
name: bench-stg_polyglot-remote-prod
services:
  atlas-api:
    # api — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: prod
      PORT: "3000"
      BENCH_DESTINATION: oodle
      OTEL_SERVICE_NAME: atlas-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=stg_polyglot,deployment.environment=prod
    ports:
      - "0.0.0.0:18068:3000"
    volumes:
      - bench-stg_polyglot-atlas-api:/app
    networks: [bench]
    depends_on: [collector]
    command: ["bun","run","start"]
    restart: unless-stopped
  atlas-web:
    # web — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: prod
      PORT: "5173"
      BENCH_DESTINATION: oodle
      OTEL_SERVICE_NAME: atlas-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=stg_polyglot,deployment.environment=prod
      VITE_SERVICE_NAME: atlas-web
      VITE_APP_ENV: prod
      VITE_DESTINATION: oodle
      VITE_API_PORT: "18068"
      VITE_OTEL_PORT: "18074"
    ports:
      - "0.0.0.0:18069:5173"
    volumes:
      - bench-stg_polyglot-atlas-web:/app
    networks: [bench]
    depends_on: [collector]
    command: ["sh","-c","bun run build && bun run preview -- --host 0.0.0.0 --port 5173"]
    restart: unless-stopped
  lantern-api:
    # api — lantern (python+svelte)
    image: python:3.12-alpine

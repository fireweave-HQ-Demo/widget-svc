# Generated by fireweave test-bench
# workspace=demo_k1 bucket=remote env=prod
# destination=openobserve
# services: <app>-api, <app>-web, collector (observability)
name: bench-demo_k1-remote-prod
services:
  atlas-api:
    # api — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: prod
      PORT: "3000"
      BENCH_DESTINATION: openobserve
      OTEL_SERVICE_NAME: atlas-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=demo_k1,deployment.environment=prod
      IDENTITY_ENABLED: "true"
      IDENTITY_SEED_PATH: /data/identity/seed.json
    ports:
      - "127.0.0.1:18004:3000"
    volumes:
      - bench-demo_k1-atlas-api:/app
      - bench-demo_k1-identity:/data/identity:ro
    networks: [bench]
    depends_on: [collector]
    command: ["bun","run","start"]
    restart: unless-stopped
  atlas-web:
    # web — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: prod
      PORT: "5173"
      BENCH_DESTINATION: openobserve
      OTEL_SERVICE_NAME: atlas-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=demo_k1,deployment.environment=prod
      VITE_SERVICE_NAME: atlas-web
      VITE_APP_ENV: prod
      VITE_DESTINATION: openobserve
      VITE_API_BASE: http://127.0.0.1:18004
      VITE_OTEL_ENDPOINT: http://127.0.0.1:18006
      VITE_IDENTITY_ENABLED: "true"
    ports:
      - "127.0.0.1:18005:5173"
    volumes:
      - bench-demo_k1-atlas-web:/app
      - bench-demo_k1-identity:/data/identity:ro
    networks: [bench]
    depends_on: [collector]
    command: ["sh","-c","bun run build && bun run preview -- --host 0.0.0.0 --port 5173"]
    restart: unless-stopped
  collector:
    # observability — OTLP → openobserve
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:18006:4318"
      - "127.0.0.1:18007:13133"
    env_file:
      - path: /Users/kalyanchowdary/Desktop/code/work/test-bench/bench/credentials/openobserve
        required: false
    volumes:
      - bench-demo_k1-collector:/etc/otelcol-contrib
    networks: [bench]
    restart: unless-stopped
networks:
  bench:
    name: bench-demo_k1-remote-prod-net
volumes:
  bench-demo_k1-atlas-api:
    external: true
  bench-demo_k1-atlas-web:
    external: true
  bench-demo_k1-collector:
    external: true
  bench-demo_k1-identity:
    external: true

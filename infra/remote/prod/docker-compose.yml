# Generated by fireweave test-bench
# workspace=demo bucket=remote env=prod
# destination=datadog
# services: <app>-api, <app>-web, collector (observability)
name: bench-demo-remote-prod
services:
  atlas-api:
    # api — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: prod
      PORT: "3000"
      BENCH_DESTINATION: datadog
      OTEL_SERVICE_NAME: atlas-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=demo,deployment.environment=prod
      IDENTITY_ENABLED: "true"
      IDENTITY_SEED_PATH: /data/identity/seed.json
    ports:
      - "0.0.0.0:18106:3000"
    volumes:
      - bench-demo-atlas-api:/app
      - bench-demo-identity:/data/identity:ro
    networks: [bench]
    depends_on: [collector]
    command: ["bun","run","start"]
    restart: unless-stopped
  atlas-web:
    # web — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: prod
      PORT: "5173"
      BENCH_DESTINATION: datadog
      OTEL_SERVICE_NAME: atlas-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=demo,deployment.environment=prod
      VITE_SERVICE_NAME: atlas-web
      VITE_APP_ENV: prod
      VITE_DESTINATION: datadog
      VITE_API_PORT: "18106"
      VITE_OTEL_PORT: "18108"
      VITE_IDENTITY_ENABLED: "true"
    ports:
      - "0.0.0.0:18107:5173"
    volumes:
      - bench-demo-atlas-web:/app
      - bench-demo-identity:/data/identity:ro
    networks: [bench]
    depends_on: [collector]
    command: ["sh","-c","bun run build && bun run preview -- --host 0.0.0.0 --port 5173"]
    restart: unless-stopped
  collector:
    # observability — OTLP → datadog
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "0.0.0.0:18108:4318"
      - "0.0.0.0:18109:13133"
    env_file:
      - path: /Users/kalyanchowdary/Desktop/code/work/test-bench/bench/credentials/datadog
        required: false
    volumes:
      - bench-demo-collector:/etc/otelcol-contrib
    networks: [bench]
    restart: unless-stopped
networks:
  bench:
    name: bench-demo-remote-prod-net
volumes:
  bench-demo-atlas-api:
    external: true
  bench-demo-atlas-web:
    external: true
  bench-demo-collector:
    external: true
  bench-demo-identity:
    external: true

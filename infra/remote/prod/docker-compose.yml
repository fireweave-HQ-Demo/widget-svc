# Generated by fireweave test-bench
# workspace=test_123 bucket=remote env=prod
# destination=control
# services: <app>-api, <app>-web, collector (observability)
name: bench-test_123-remote-prod
services:
  atlas-api:
    # api — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: prod
      PORT: "3000"
      BENCH_DESTINATION: control
      OTEL_SERVICE_NAME: atlas-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=test_123,deployment.environment=prod
      IDENTITY_ENABLED: "true"
      IDENTITY_SEED_PATH: /data/identity/seed.json
    ports:
      - "0.0.0.0:18056:3000"
    volumes:
      - bench-test_123-atlas-api:/app
      - bench-test_123-identity:/data/identity:ro
    networks: [bench]
    depends_on: [collector]
    command: ["bun","run","start"]
    restart: unless-stopped
  atlas-web:
    # web — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: prod
      PORT: "5173"
      BENCH_DESTINATION: control
      OTEL_SERVICE_NAME: atlas-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=test_123,deployment.environment=prod
      VITE_SERVICE_NAME: atlas-web
      VITE_APP_ENV: prod
      VITE_DESTINATION: control
      VITE_API_PORT: "18056"
      VITE_OTEL_PORT: "18058"
      VITE_IDENTITY_ENABLED: "true"
    ports:
      - "0.0.0.0:18057:5173"
    volumes:
      - bench-test_123-atlas-web:/app
      - bench-test_123-identity:/data/identity:ro
    networks: [bench]
    depends_on: [collector]
    command: ["sh","-c","bun run build && bun run preview -- --host 0.0.0.0 --port 5173"]
    restart: unless-stopped
  collector:
    # observability — OTLP → control
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "0.0.0.0:18058:4318"
      - "0.0.0.0:18059:13133"
    volumes:
      - bench-test_123-collector:/etc/otelcol-contrib
    networks: [bench]
    restart: unless-stopped
networks:
  bench:
    name: bench-test_123-remote-prod-net
volumes:
  bench-test_123-atlas-api:
    external: true
  bench-test_123-atlas-web:
    external: true
  bench-test_123-collector:
    external: true
  bench-test_123-identity:
    external: true

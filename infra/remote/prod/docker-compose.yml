# Generated by fireweave test-bench
# workspace=prod_dd_bench bucket=remote env=prod
# destination=datadog
# services: <app>-api, <app>-web, collector (observability)
name: bench-prod_dd_bench-remote-prod
services:
  atlas-api:
    # api — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: prod
      PORT: "3000"
      BENCH_DESTINATION: datadog
      OTEL_SERVICE_NAME: atlas-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=prod_dd_bench,deployment.environment=prod
    ports:
      - "0.0.0.0:18046:3000"
    volumes:
      - bench-prod_dd_bench-atlas-api:/app
    networks: [bench]
    depends_on: [collector]
    command: ["bun","run","start"]
    restart: unless-stopped
  atlas-web:
    # web — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: prod
      PORT: "5173"
      BENCH_DESTINATION: datadog
      OTEL_SERVICE_NAME: atlas-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=prod_dd_bench,deployment.environment=prod
      VITE_SERVICE_NAME: atlas-web
      VITE_APP_ENV: prod
      VITE_DESTINATION: datadog
      VITE_API_PORT: "18046"
      VITE_OTEL_PORT: "18050"
    ports:
      - "0.0.0.0:18047:5173"
    volumes:
      - bench-prod_dd_bench-atlas-web:/app
    networks: [bench]
    depends_on: [collector]
    command: ["sh","-c","bun run build && bun run preview -- --host 0.0.0.0 --port 5173"]
    restart: unless-stopped
  lantern-api:
    # api — lantern (python+svelte)
    image: python:3.12-alpine
    working_dir: /app
    environment:
      APP_ENV: prod
      PORT: "3000"
      BENCH_DESTINATION: datadog
      OTEL_SERVICE_NAME: lantern-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=prod_dd_bench,deployment.environment=prod
      PYTHONPATH: /app
    ports:
      - "0.0.0.0:18048:3000"
    volumes:
      - bench-prod_dd_bench-lantern-api:/app
    networks: [bench]
    depends_on: [collector]
    command: ["python","-m","src.main"]
    restart: unless-stopped
  lantern-web:
    # web — lantern (python+svelte)
    image: node:22-alpine
    working_dir: /app
    environment:
      APP_ENV: prod
      PORT: "5173"
      BENCH_DESTINATION: datadog
      OTEL_SERVICE_NAME: lantern-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=prod_dd_bench,deployment.environment=prod
      VITE_SERVICE_NAME: lantern-web
      VITE_APP_ENV: prod
      VITE_DESTINATION: datadog
      VITE_API_PORT: "18048"
      VITE_OTEL_PORT: "18050"
    ports:
      - "0.0.0.0:18049:5173"
    volumes:
      - bench-prod_dd_bench-lantern-web:/app
    networks: [bench]
    depends_on: [collector]
    command: ["sh","-c","npm run build && npm run preview -- --host 0.0.0.0 --port 5173"]
    restart: unless-stopped
  collector:
    # observability — OTLP → datadog
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "0.0.0.0:18050:4318"
      - "0.0.0.0:18051:13133"
    env_file:
      - path: /Users/kalyanchowdary/Desktop/code/work/test-bench/bench/credentials/datadog
        required: false
    volumes:
      - bench-prod_dd_bench-collector:/etc/otelcol-contrib
    networks: [bench]
    restart: unless-stopped
networks:
  bench:
    name: bench-prod_dd_bench-remote-prod-net
volumes:
  bench-prod_dd_bench-atlas-api:
    external: true
  bench-prod_dd_bench-atlas-web:
    external: true
  bench-prod_dd_bench-lantern-api:
    external: true
  bench-prod_dd_bench-lantern-web:
    external: true
  bench-prod_dd_bench-collector:
    external: true

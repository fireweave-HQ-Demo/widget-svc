# Generated by fireweave test-bench
# workspace=oodle_react_ts bucket=remote env=prod
# destination=oodle
# services: <app>-api, <app>-web, collector (observability)
name: bench-oodle_react_ts-remote-prod
services:
  atlas-api:
    # api — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: prod
      PORT: "3000"
      BENCH_DESTINATION: oodle
      OTEL_SERVICE_NAME: atlas-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=oodle_react_ts,deployment.environment=prod
    ports:
      - "0.0.0.0:18024:3000"
    volumes:
      - bench-oodle_react_ts-atlas-api:/app
    networks: [bench]
    depends_on: [collector]
    command: ["bun","run","start"]
    restart: unless-stopped
  atlas-web:
    # web — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: prod
      PORT: "5173"
      BENCH_DESTINATION: oodle
      OTEL_SERVICE_NAME: atlas-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=oodle_react_ts,deployment.environment=prod
      VITE_SERVICE_NAME: atlas-web
      VITE_APP_ENV: prod
      VITE_DESTINATION: oodle
      VITE_API_PORT: "18024"
      VITE_OTEL_PORT: "18026"
    ports:
      - "0.0.0.0:18025:5173"
    volumes:
      - bench-oodle_react_ts-atlas-web:/app
    networks: [bench]
    depends_on: [collector]
    command: ["sh","-c","bun run build && bun run preview -- --host 0.0.0.0 --port 5173"]
    restart: unless-stopped
  collector:
    # observability — OTLP → oodle
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "0.0.0.0:18026:4318"
      - "0.0.0.0:18027:13133"
    env_file:
      - path: /Users/kalyanchowdary/Desktop/code/work/test-bench/bench/credentials/oodle
        required: false
    volumes:
      - bench-oodle_react_ts-collector:/etc/otelcol-contrib
    networks: [bench]
    restart: unless-stopped
networks:
  bench:
    name: bench-oodle_react_ts-remote-prod-net
volumes:
  bench-oodle_react_ts-atlas-api:
    external: true
  bench-oodle_react_ts-atlas-web:
    external: true
  bench-oodle_react_ts-collector:
    external: true

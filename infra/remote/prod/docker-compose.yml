# Generated by fireweave test-bench
# workspace=stg_bench bucket=remote env=prod
# destination=oodle
# services: <app>-api, <app>-web, collector (observability)
name: bench-stg_bench-remote-prod
services:
  atlas-api:
    # api — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    env_file:
      - path: ../../../.env.fireweave
        required: true
    environment:
      APP_ENV: prod
      PORT: "3000"
      BENCH_DESTINATION: oodle
      OTEL_SERVICE_NAME: atlas-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=stg_bench,deployment.environment=prod
    ports:
      - "0.0.0.0:18010:3000"
    volumes:
      - bench-stg_bench-atlas-api:/app
    networks: [bench]
    depends_on: [collector]
    command: ["bun","run","start"]
    restart: unless-stopped
  atlas-web:
    # web — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    env_file:
      - path: ../../../.env.fireweave
        required: true
    environment:
      APP_ENV: prod
      PORT: "5173"
      BENCH_DESTINATION: oodle
      OTEL_SERVICE_NAME: atlas-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=stg_bench,deployment.environment=prod
      VITE_SERVICE_NAME: atlas-web
      VITE_APP_ENV: prod
      VITE_DESTINATION: oodle
      VITE_API_PORT: "18010"
      VITE_OTEL_PORT: "18014"
    ports:
      - "0.0.0.0:18011:5173"
    volumes:
      - bench-stg_bench-atlas-web:/app
    networks: [bench]
    depends_on: [collector]
    command: ["sh","-c","bun run build && bun run preview -- --host 0.0.0.0 --port 5173"]
    restart: unless-stopped
  lantern-api:
    # api — lantern (python+svelte)
    image: python:3.12-alpine
    working_dir: /app
    env_file:
      - path: ../../../.env.fireweave
        required: true
    environment:
      APP_ENV: prod
      PORT: "3000"
      BENCH_DESTINATION: oodle
      OTEL_SERVICE_NAME: lantern-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=stg_bench,deployment.environment=prod
      PYTHONPATH: /app
    ports:
      - "0.0.0.0:18012:3000"
    volumes:
      - bench-stg_bench-lantern-api:/app
    networks: [bench]
    depends_on: [collector]
    command: ["sh","-c","pip install -q -r requirements.txt --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ 2>/dev/null || pip install -q -r requirements.txt; python -m src.main"]
    restart: unless-stopped
  lantern-web:
    # web — lantern (python+svelte)
    image: node:22-alpine
    working_dir: /app
    env_file:
      - path: ../../../.env.fireweave
        required: true
    environment:
      APP_ENV: prod
      PORT: "5173"
      BENCH_DESTINATION: oodle
      OTEL_SERVICE_NAME: lantern-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=stg_bench,deployment.environment=prod
      VITE_SERVICE_NAME: lantern-web
      VITE_APP_ENV: prod
      VITE_DESTINATION: oodle
      VITE_API_PORT: "18012"
      VITE_OTEL_PORT: "18014"
    ports:
      - "0.0.0.0:18013:5173"
    volumes:
      - bench-stg_bench-lantern-web:/app
    networks: [bench]
    depends_on: [collector]
    command: ["sh","-c","npm run build && npm run preview -- --host 0.0.0.0 --port 5173"]
    restart: unless-stopped
  collector:
    # observability — OTLP → oodle
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "0.0.0.0:18014:4318"
      - "0.0.0.0:18015:13133"
    env_file:
      - path: /Users/kalyanchowdary/Desktop/code/work/test-bench/bench/credentials/oodle
        required: false
    volumes:
      - bench-stg_bench-collector:/etc/otelcol-contrib
    networks: [bench]
    restart: unless-stopped
networks:
  bench:
    name: bench-stg_bench-remote-prod-net
volumes:
  bench-stg_bench-atlas-api:
    external: true
  bench-stg_bench-atlas-web:
    external: true
  bench-stg_bench-lantern-api:
    external: true
  bench-stg_bench-lantern-web:
    external: true
  bench-stg_bench-collector:
    external: true

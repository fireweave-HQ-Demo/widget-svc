# Generated by fireweave test-bench
# workspace=tue_test bucket=remote env=prod
# destination=openobserve
# services: <app>-api, <app>-web, collector (observability)
name: bench-tue_test-remote-prod
services:
  atlas-api:
    # api — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: prod
      PORT: "3000"
      BENCH_DESTINATION: openobserve
      OTEL_SERVICE_NAME: atlas-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=tue_test,deployment.environment=prod
      FW_ATTEST_URL: ${FW_ATTEST_URL}
      FW_API_URL: ${FW_API_URL}
      FW_PROJECT_API_KEY: ${FW_PROJECT_API_KEY}
    ports:
      - "0.0.0.0:18012:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      - bench-tue_test-atlas-api:/app
    networks: [bench, fireweaveai]
    depends_on: [collector]
    command: ["bun","run","start"]
    restart: unless-stopped
  atlas-web:
    # web — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: prod
      PORT: "5173"
      BENCH_DESTINATION: openobserve
      OTEL_SERVICE_NAME: atlas-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=tue_test,deployment.environment=prod
      VITE_SERVICE_NAME: atlas-web
      VITE_APP_ENV: prod
      VITE_DESTINATION: openobserve
      VITE_API_PORT: "18012"
      VITE_OTEL_PORT: "18014"
      PUBLIC_FW_ATTEST_URL: ${PUBLIC_FW_ATTEST_URL}
      PUBLIC_FW_API_URL: ${PUBLIC_FW_API_URL}
      PUBLIC_FW_PROJECT_API_KEY: ${PUBLIC_FW_PROJECT_API_KEY}
      VITE_FW_ATTEST_URL: ${VITE_FW_ATTEST_URL}
      VITE_FW_API_URL: ${VITE_FW_API_URL}
      VITE_FW_PROJECT_API_KEY: ${VITE_FW_PROJECT_API_KEY}
    ports:
      - "0.0.0.0:18013:5173"
    env_file:
      - path: .env
        required: false
    volumes:
      - bench-tue_test-atlas-web:/app
    networks: [bench]
    depends_on: [collector]
    command: ["sh","-c","bun run build && bun run preview -- --host 0.0.0.0 --port 5173"]
    restart: unless-stopped
  fw-loopback:
    # Shares atlas-api netns so FW_* can use http://127.0.0.1:3001 (SDK host rule).
    image: alpine/socat:1.8.0.1
    network_mode: "service:atlas-api"
    depends_on: [atlas-api]
    command:
      [
        "TCP-LISTEN:3001,fork,reuseaddr,bind=127.0.0.1",
        "TCP:fw-server:3001",
      ]
    restart: unless-stopped
  collector:
    # observability — OTLP → openobserve
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "0.0.0.0:18014:4318"
      - "0.0.0.0:18015:13133"
    env_file:
      - path: /workspaces/fireweaveai-platform/.worktrees/test-bench/bench/credentials/openobserve
        required: false
    volumes:
      - bench-tue_test-collector:/etc/otelcol-contrib
    networks: [bench]
    restart: unless-stopped
networks:
  bench:
    name: bench-tue_test-remote-prod-net
  fireweaveai:
    external: true
    name: fireweaveai-network
volumes:
  bench-tue_test-atlas-api:
    external: true
  bench-tue_test-atlas-web:
    external: true
  bench-tue_test-collector:
    external: true

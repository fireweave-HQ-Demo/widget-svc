# Generated by fireweave test-bench
# workspace=dd_react_python bucket=remote env=prod
# destination=datadog
# services: <app>-api, <app>-web, collector (observability)
name: bench-dd_react_python-remote-prod
services:
  atlas-api:
    # api — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: prod
      PORT: "3000"
      BENCH_DESTINATION: datadog
      OTEL_SERVICE_NAME: atlas-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=dd_react_python,deployment.environment=prod
      IDENTITY_ENABLED: "true"
      IDENTITY_SEED_PATH: /data/identity/seed.json
    env_file:
      - path: /Users/kalyanchowdary/Desktop/code/work/test-bench/bench/credentials/fireweave-rpd
        required: true
    ports:
      - "0.0.0.0:18014:3000"
    volumes:
      - bench-dd_react_python-atlas-api:/app
      - ../../identity/seed.json:/data/identity/seed.json:ro
    networks: [bench]
    depends_on: [collector]
    command: ["bun","run","start"]
    restart: unless-stopped
  atlas-web:
    # web — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: prod
      PORT: "5173"
      BENCH_DESTINATION: datadog
      OTEL_SERVICE_NAME: atlas-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=dd_react_python,deployment.environment=prod
      IDENTITY_ENABLED: "true"
      IDENTITY_SEED_PATH: /data/identity/seed.json
      VITE_SERVICE_NAME: atlas-web
      VITE_APP_ENV: prod
      VITE_DESTINATION: datadog
      VITE_API_PORT: "18014"
      VITE_OTEL_PORT: "18018"
      VITE_IDENTITY_ENABLED: "true"
    env_file:
      - path: /Users/kalyanchowdary/Desktop/code/work/test-bench/bench/credentials/fireweave-rpd
        required: true
    ports:
      - "0.0.0.0:18015:5173"
    volumes:
      - bench-dd_react_python-atlas-web:/app
    networks: [bench]
    depends_on: [collector]
    command: ["sh","-c","bun run build && bun run preview -- --host 0.0.0.0 --port 5173"]
    restart: unless-stopped
  lantern-api:
    # api — lantern (python+svelte)
    image: python:3.12-alpine
    working_dir: /app
    environment:
      APP_ENV: prod
      PORT: "3000"
      BENCH_DESTINATION: datadog
      OTEL_SERVICE_NAME: lantern-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=dd_react_python,deployment.environment=prod
      IDENTITY_ENABLED: "true"
      IDENTITY_SEED_PATH: /data/identity/seed.json
      PYTHONPATH: /app
    env_file:
      - path: /Users/kalyanchowdary/Desktop/code/work/test-bench/bench/credentials/fireweave-rpd
        required: true
    ports:
      - "0.0.0.0:18016:3000"
    volumes:
      - bench-dd_react_python-lantern-api:/app
      - ../../identity/seed.json:/data/identity/seed.json:ro
    networks: [bench]
    depends_on: [collector]
    command: ["sh","-c","pip install -q -r requirements.txt 2>/dev/null; python -m src.main"]
    restart: unless-stopped
  lantern-web:
    # web — lantern (python+svelte)
    image: node:22-alpine
    working_dir: /app
    environment:
      APP_ENV: prod
      PORT: "5173"
      BENCH_DESTINATION: datadog
      OTEL_SERVICE_NAME: lantern-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=dd_react_python,deployment.environment=prod
      IDENTITY_ENABLED: "true"
      IDENTITY_SEED_PATH: /data/identity/seed.json
      VITE_SERVICE_NAME: lantern-web
      VITE_APP_ENV: prod
      VITE_DESTINATION: datadog
      VITE_API_PORT: "18016"
      VITE_OTEL_PORT: "18018"
      VITE_IDENTITY_ENABLED: "true"
    env_file:
      - path: /Users/kalyanchowdary/Desktop/code/work/test-bench/bench/credentials/fireweave-rpd
        required: true
    ports:
      - "0.0.0.0:18017:5173"
    volumes:
      - bench-dd_react_python-lantern-web:/app
    networks: [bench]
    depends_on: [collector]
    command: ["sh","-c","npm run build && npm run preview -- --host 0.0.0.0 --port 5173"]
    restart: unless-stopped
  collector:
    # observability — OTLP → datadog
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "0.0.0.0:18018:4318"
      - "0.0.0.0:18019:13133"
    env_file:
      - path: /Users/kalyanchowdary/Desktop/code/work/test-bench/bench/credentials/datadog
        required: false
    volumes:
      - bench-dd_react_python-collector:/etc/otelcol-contrib
    networks: [bench]
    restart: unless-stopped
networks:
  bench:
    name: bench-dd_react_python-remote-prod-net
volumes:
  bench-dd_react_python-atlas-api:
    external: true
  bench-dd_react_python-atlas-web:
    external: true
  bench-dd_react_python-lantern-api:
    external: true
  bench-dd_react_python-lantern-web:
    external: true
  bench-dd_react_python-collector:
    external: true

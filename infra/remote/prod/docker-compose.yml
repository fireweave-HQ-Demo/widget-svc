# Generated by fireweave test-bench
# workspace=oo_widget bucket=remote env=prod
# destination=openobserve
# services: <app>-api, <app>-web, collector (observability)
name: bench-oo_widget-remote-prod
services:
  atlas-api:
    # api — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: prod
      PORT: "3000"
      BENCH_DESTINATION: openobserve
      OTEL_SERVICE_NAME: atlas-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=oo_widget,deployment.environment=prod
    ports:
      - "0.0.0.0:18004:3000"
    volumes:
      - bench-oo_widget-atlas-api:/app
    networks: [bench]
    depends_on: [collector]
    command: ["bun","run","start"]
    restart: unless-stopped
  atlas-web:
    # web — atlas (bun+react)
    image: oven/bun:1.2-alpine
    working_dir: /app
    environment:
      APP_ENV: prod
      PORT: "5173"
      BENCH_DESTINATION: openobserve
      OTEL_SERVICE_NAME: atlas-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=oo_widget,deployment.environment=prod
      VITE_SERVICE_NAME: atlas-web
      VITE_APP_ENV: prod
      VITE_DESTINATION: openobserve
      VITE_API_PORT: "18004"
      VITE_OTEL_PORT: "18006"
    ports:
      - "0.0.0.0:18005:5173"
    volumes:
      - bench-oo_widget-atlas-web:/app
    networks: [bench]
    depends_on: [collector]
    command: ["sh","-c","bun run build && bun run preview -- --host 0.0.0.0 --port 5173"]
    restart: unless-stopped
  collector:
    # observability — OTLP → openobserve
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "0.0.0.0:18006:4318"
      - "0.0.0.0:18007:13133"
    env_file:
      - path: /workspaces/fireweaveai-platform/.worktrees/test-bench/bench/credentials/openobserve
        required: false
    volumes:
      - bench-oo_widget-collector:/etc/otelcol-contrib
    networks: [bench]
    restart: unless-stopped
networks:
  bench:
    name: bench-oo_widget-remote-prod-net
volumes:
  bench-oo_widget-atlas-api:
    external: true
  bench-oo_widget-atlas-web:
    external: true
  bench-oo_widget-collector:
    external: true
